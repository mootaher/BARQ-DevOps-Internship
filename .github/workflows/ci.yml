name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgresql://barq_app:ci-password@postgres:5432/barq_tasks
      REDIS_URL: redis://redis:6379/0
      PUBLIC_PORT: 8090

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check script syntax
        run: |
          python3 -m py_compile validate.py failure_test.py scripts/analyze_logs.py
          bash -n backup.sh restore.sh

      - name: Validate Docker Compose syntax
        run: docker compose config -q

      - name: Build containers
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8090/ready >/dev/null && [ "$(docker inspect --format='{{.State.Health.Status}}' nginx 2>/dev/null || true)" = "healthy" ]; then
              echo "Stack is ready"
              exit 0
            fi

            echo "Waiting for readiness: attempt ${attempt}/45"
            sleep 2
          done

          echo "Stack did not become ready in time" >&2
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run environment validation
        run: python3 validate.py

      - name: Show container state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
